[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siam_vqe"
version = "0.4.0"
description = "VQE for single-impurity Anderson models on Qiskit, validated against EDRIXS."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Liam Schmidt" }]
license = { text = "MIT" }
dependencies = [
    "mthree>=2.6",
    "qiskit>=2.3,<3",
    "qiskit-aer>=0.17",
    "qiskit-nature>=0.8,<0.9",
    "qiskit-algorithms>=0.4",
    "qiskit-ibm-runtime>=0.49",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbconvert>=7.16",
]

[tool.hatch.build.targets.wheel]
packages = ["siam_vqe"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # let formatter handle line length

[tool.ruff.lint.per-file-ignores]
"siam_vqe/__init__.py" = ["F401"]
"siam_vqe/adapt_vqe.py" = ["N802", "N803", "N806", "RUF002", "RUF003"]
