[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["siam_vqe"]

[[tool.mypy.overrides]]
module = ["mthree.*", "sympy.*", "qiskit.*", "qiskit_nature.*", "qiskit_algorithms.*", "qiskit_aer.*", "qiskit_ibm_runtime.*", "scipy.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Interim suppression of Qiskit-Pulse-package deprecations that originate
# entirely inside the pinned dependencies (qiskit 1.4.5 / qiskit-aer 0.17.2 /
# qiskit-ibm-runtime 0.44.1), NOT in siam_vqe. The M3 path runs FakeMarrakesh's
# huge noise model through qiskit-aer, which reads the deprecated
# Instruction.condition property via getattr() once per instruction
# (quantum_error.py:322, aer_compiler.py:695) — ~600k warnings per M3 run, ~1.5M
# across the suite. Transpiling against FakeMarrakesh's pulse-carrying backend
# trips DAGCircuit/QuantumCircuit.calibrations in qiskit's pulse_gate_validation
# pass and qiskit-ibm-runtime utils. None is actionable in this repo. This is a
# STOPGAP: in Qiskit 2.0 the Pulse package is removed, so the real fix is the
# 2.0-ready dependency migration, after which these warnings disappear at the
# source. Filters are message-scoped (not blanket DeprecationWarning) so genuine
# deprecations in siam_vqe's own API usage still surface. See
# docs/superpowers/notes/2026-05-29-pulse-deprecation-triage.md
filterwarnings = [
    # qiskit-nature 0.8 still builds UCCSD / HartreeFock on BlueprintCircuit,
    # deprecated in Qiskit 2.1 and slated for removal in 3.0. Nothing in
    # siam_vqe touches it; this clears once qiskit-nature moves off it.
    "ignore:The class ``qiskit.circuit.library.blueprintcircuit.BlueprintCircuit``:DeprecationWarning",
    "ignore:The class ``qiskit.circuit.library.n_local:DeprecationWarning",
]
